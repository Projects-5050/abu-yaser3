<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f2a22">
<title>أرشيف أبو ياسر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap">
<style>
/* Private vault: bottle-green rail, cool stone ground, quiet cards; Tajawal light/bold; calm, generous space, colour only for state */
:root{--green:#0f2a22;--green2:#16362c;--green3:#1e4538;--stone:#e8ebe7;--card:#f6f7f5;--ink:#12201b;--ink2:#2c3a35;--muted:#5d6b65;--pewter:#9aa7a0;--line:#d6dcd8;--soft:#e1e6e2;
 --red:#a5261d;--red-ink:#a5261d;--amber:#8f5d00;--ok:#2d6a4f;--rail-fg:#c9d6cf;
 --f:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;--gut:32px;--r:18px;--sh:0 1px 2px rgba(15,42,34,.06),0 12px 30px rgba(15,42,34,.06)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f);background:var(--stone);color:var(--ink);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:256px minmax(0,1fr);grid-template-rows:1fr auto;min-height:100vh}
::selection{background:var(--green);color:#fff}
button,input,select,textarea{font:inherit;color:inherit}
a{cursor:pointer}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.num,td,.kv b,.dn{font-variant-numeric:tabular-nums}
@media(max-width:860px){body{display:block}:root{--gut:16px}}

/* rail */
header.top{grid-row:1/3;background:var(--green);color:var(--rail-fg);padding:28px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:26px;overflow:auto}
.brand{display:flex;flex-direction:column;gap:18px}
.brand h1{margin:0;color:#fff;font-weight:700;font-size:22px;line-height:1.2}
.brand h1 br{display:none}
.brand p{margin:4px 0 0;font-size:13px;font-weight:300;color:var(--pewter)}
.mono{display:none}
.hsearch{display:flex;gap:6px;background:var(--green2);border-radius:12px;padding:4px 4px 4px 10px}
.hsearch input{flex:1;min-width:0;border:0;background:transparent;color:#fff;padding:6px 8px;outline:none}
.hsearch input::placeholder{color:var(--pewter)}
.hsearch .btn{background:var(--green3);border:0;border-radius:9px;padding:6px 12px;font-size:14px}
.sess{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sess .btn.ghost{color:#fff;border-color:#ffffff40;background:transparent}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;justify-content:space-between;background:none;border:0;color:var(--rail-fg);padding:11px 14px;border-radius:12px;cursor:pointer;font-weight:500;font-size:15.5px;text-align:start}
.nav button:hover:not(.active){background:#ffffff0d}
.nav button.active{background:#ffffff17;color:#fff;font-weight:700}
.pill{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:#ff8f86;color:var(--green);font-size:12px;font-weight:700}
@media(max-width:860px){header.top{position:static;height:auto;padding:18px 16px;gap:14px}.nav{flex-direction:row;flex-wrap:wrap;gap:4px}.nav button{padding:8px 12px;font-size:14.5px}}
main{grid-column:2;width:100%;max-width:1180px;padding:40px var(--gut) 56px}
footer{grid-column:2;color:var(--muted);font-size:13px;padding:0 var(--gut) 28px;font-weight:300}

/* structure */
.card{background:var(--card);border-radius:var(--r);padding:24px 26px;margin-bottom:24px;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
h2{font-size:19px;font-weight:700;margin:0 0 14px;color:var(--ink);text-wrap:balance}
h3{font-size:16px;font-weight:700;margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:13.5px}
.red{color:var(--red)}.amber{color:var(--amber)}

/* home */
.notice{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:14px;padding:12px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.notice span{flex:1;min-width:220px}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:14px;padding:12px 18px;margin-bottom:14px}
.hero{display:grid;grid-template-columns:1fr 1.25fr;gap:24px;margin:10px 0 28px}
@media(max-width:1000px){.hero{grid-template-columns:1fr}}
.hero-l{background:var(--green);color:#fff;border-radius:var(--r);padding:26px 28px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh)}
.greet{font-weight:300;font-size:clamp(26px,3vw,34px);line-height:1.2;margin:0}
.greet b{font-weight:700}
.nextdoc{display:flex;gap:18px;align-items:center;margin-top:auto;padding-top:18px;border-top:1px solid #ffffff22}
.nextdoc svg{width:96px;height:96px;flex:none}
.nextdoc .ring-bg{stroke:#ffffff22}
.nextdoc .ring{transition:stroke-dashoffset 1.4s cubic-bezier(.16,1,.3,1)}
.nextdoc b{display:block;font-size:19px;font-weight:700}
.nextdoc span{color:var(--rail-fg);font-size:14px}
.hero-l .meta{font-size:14px;color:var(--rail-fg);font-weight:300}
.hero-r{background:var(--card);border-radius:var(--r);padding:20px 24px;box-shadow:var(--sh)}
.hero-r h2{display:flex;justify-content:space-between;align-items:baseline}
.hero-r .foot{padding-top:12px}
.drow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.drow:last-of-type{border-bottom:0}
.drow .dn{display:none}
.drow b{font-weight:700;font-size:16px}
.drow>div>span{display:block;font-size:13.5px;color:var(--muted)}
.drow:hover b{color:var(--green3)}

/* buttons */
.btn{background:var(--green);color:#fff;border:1px solid var(--green);border-radius:11px;padding:8px 18px;cursor:pointer;font-weight:700;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.btn:hover{background:var(--green3);border-color:var(--green3)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--pewter)}
.btn.ghost:hover{border-color:var(--green);color:var(--green)}
.btn.danger{background:transparent;color:var(--red);border-color:#d9b2ae}
.btn.danger:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn.gold{background:var(--green3);border-color:var(--green3)}
.btn.wa{background:var(--green)}
.btn.sm{padding:5px 12px;font-size:13.5px;border-radius:9px}
.inp{border:1px solid var(--line);border-radius:11px;padding:8px 14px;background:#fff;min-width:220px;outline:none}
.inp:focus{border-color:var(--green)}
.lnk{color:var(--green3);font-size:14px;font-weight:700}
.lnk:hover{text-decoration:underline}

/* members */
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.mcard{background:#fff;border-radius:16px;padding:16px 12px;text-align:center;cursor:pointer;position:relative;transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.mcard .nm{font-weight:700}
.mcard .dot{position:absolute;top:10px;inset-inline-start:10px}
.av{width:80px;height:80px;border-radius:50%;object-fit:cover;background:var(--soft);display:grid;place-items:center;margin:0 auto 10px;font-size:30px;color:var(--green);font-weight:700;flex:none}
.av.lg{width:132px;height:132px;font-size:50px;margin:0}
.av.sm{width:38px;height:38px;font-size:15px;margin:0}
.badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-expired{background:#f5e0de;color:var(--red)}.b-soon{background:#f3e8d2;color:var(--amber)}.b-ok{background:#dcebe3;color:var(--ok)}.b-none{background:var(--soft);color:var(--muted)}
.list .item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.list .item:hover b{color:var(--green3)}
.list .item .grow{flex:1;min-width:0}
.gtitle{font-weight:700;font-size:15px;color:var(--green3);margin:8px 0 12px;display:flex;align-items:center;gap:10px}
.gtitle:after{content:"";flex:1;height:1px;background:var(--line)}
.hbadge{display:inline-block;margin-top:6px;padding:1px 10px;border-radius:999px;background:var(--soft);color:var(--green3);font-size:12px;font-weight:700}

/* profile */
.profile{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;background:var(--card);border-radius:var(--r);padding:26px;box-shadow:var(--sh)}
.pinfo{flex:1;min-width:240px}
.pinfo h2{font-size:30px!important;font-weight:300!important}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;color:var(--ink2)}
.notes{margin-top:14px;background:var(--stone);border-radius:12px;padding:12px 14px;font-size:14.5px}
.pact{display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:6px;margin:6px 0 18px;background:var(--soft);padding:5px;border-radius:14px;width:fit-content;max-width:100%;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:8px 16px;cursor:pointer;font-weight:500;color:var(--muted);border-radius:10px}
.tabs button.active{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(15,42,34,.08)}

/* docs */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.doc{background:#fff;border-radius:16px;padding:18px 20px;box-shadow:var(--sh)}
.dhead{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.dt{font-weight:700;font-size:17px}
.dbig{font-weight:700;font-size:28px;line-height:1;text-align:end;direction:ltr;color:var(--ink)}
.dbig small{display:block;font-size:12px;font-weight:400;color:var(--muted);direction:rtl;margin-top:4px}
.doc.expired .dbig{color:var(--red)}.doc.soon .dbig{color:var(--amber)}.doc.ok .dbig,.doc.none .dbig{color:var(--pewter);font-weight:500;font-size:22px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px 14px;margin-top:14px}
.kv span{display:block;color:var(--muted);font-size:12.5px}
.kv b{font-weight:700;font-size:14.5px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.thumb{width:76px;height:76px;border-radius:10px;object-fit:cover;cursor:pointer;background:var(--stone);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);text-align:center;overflow:hidden}
.dacts{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* files */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.ftile{background:#fff;border-radius:12px;padding:6px;cursor:pointer;transition:box-shadow .2s}
.ftile:hover{box-shadow:var(--sh)}
.ftile .ic{height:100px;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted);background:var(--stone);border-radius:8px;overflow:hidden}
.ftile .ic.dir{background:var(--green);color:#fff}
.ftile img{width:100%;height:100%;object-fit:cover}
.ftile .nm{font-size:13px;margin-top:6px;word-break:break-word;line-height:1.35;max-height:2.7em;overflow:hidden}
.ftile .pth{font-size:11px;color:var(--muted);word-break:break-word;line-height:1.3;max-height:2.6em;overflow:hidden}
.fbar{margin-bottom:14px}
.crumbs a{color:var(--green3);font-weight:700}
.crumbs a:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start}
th{color:var(--muted);font-weight:500;font-size:13.5px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--stone)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,42,34,.45);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:22px;width:min(660px,100%);max-height:92vh;overflow:auto;padding:26px 28px;box-shadow:0 10px 30px rgba(15,42,34,.18),0 40px 80px rgba(15,42,34,.18)}
.modal h2{font-size:22px;font-weight:700}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
@media(max-width:600px){.form{grid-template-columns:1fr}}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:#fff;color:var(--ink);font-weight:400;font-size:15px;outline:none}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--green)}
textarea{min-height:80px;resize:vertical}
.mfoot{margin-top:22px}
.box{background:var(--stone);border-radius:12px;padding:12px 14px}
label.chk{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;color:var(--ink)}
input[type=checkbox]{accent-color:var(--green);width:16px;height:16px}

/* viewer */
.lb{position:fixed;inset:0;background:rgba(8,20,16,.94);z-index:60;display:flex;align-items:center;justify-content:center}
.lb .stage{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:60px 70px}
.lb img,.lb video{max-width:100%;max-height:100%;border-radius:8px}
.lb iframe{width:100%;height:100%;border:0;background:#fff;border-radius:8px}
.lb .cap{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;font-size:14px}
.lb .tb{position:absolute;top:12px;inset-inline-end:14px;display:flex;gap:8px}
.lb .tb .btn.ghost{color:#fff;border-color:#ffffff55}
.lb .nb{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);color:#fff;border:0;font-size:28px;width:48px;height:64px;border-radius:12px;cursor:pointer}
.lb .nb:hover{background:rgba(255,255,255,.25)}
.lb .prev{right:12px}.lb .next{left:12px}

.toast{position:fixed;bottom:22px;left:22px;background:var(--green);color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 8px 26px rgba(15,42,34,.3);z-index:80;max-width:420px;animation:tin .4s cubic-bezier(.16,1,.3,1)}
.toast.err{background:var(--red)}
@keyframes tin{from{transform:translateY(12px)}}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .glyph{font-weight:300;font-size:56px;color:var(--pewter);line-height:1;margin-bottom:6px}
[hidden]{display:none!important}
.chip{font-size:13px;font-weight:700;white-space:nowrap;color:#fff}
@media(max-width:860px){main,footer{grid-column:auto}main{padding-top:20px}}
@media(max-width:600px){.card,.hero-l,.hero-r,.profile{padding:18px 16px}.members{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mcard{padding:12px 8px}.av{width:64px;height:64px;font-size:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div>
      <h1>أرشيف أبو ياسر</h1>
      <p>عمار أحمد النشابة · المرجع العائلي للصور والمستندات</p>
    </div>
    <div class="hsearch"><input id="gq" placeholder="ابحث عن فرد أو مستند أو رقم…"><button class="btn" data-act="gsearch">بحث</button></div>
    <div class="sess" id="sess"></div>
  </div>
  <nav class="nav">
    <button data-act="nav" data-v="home">الرئيسية</button>
    <button data-act="nav" data-v="alerts">التنبيهات<span class="pill" id="navAlertCount" hidden></span></button>
    <button data-act="nav" data-v="library">مكتبة الملفات</button>
    <button data-act="nav" data-v="settings">الإعدادات والنسخ الاحتياطي</button>
  </nav>
</header>
<main id="main"></main>
<footer>صُمِّم خصيصاً لـ عمار أحمد النشابة (أبو ياسر) — جميع البيانات محفوظة على هذا الجهاز فقط</footer>
<input type="file" id="importInp" accept=".json,application/json" hidden>

<script>
/* ============ قاعدة البيانات ============ */
const DB_NAME='abu-yaser-archive';let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('members',{keyPath:'id'});const s=d.createObjectStore('docs',{keyPath:'id'});s.createIndex('memberId','memberId');d.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const store=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const P=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const getAll=s=>P(store(s).getAll());
const put=(s,v,k)=>P(k===undefined?store(s,'readwrite').put(v):store(s,'readwrite').put(v,k));
const del=(s,k)=>P(store(s,'readwrite').delete(k));
const kvGet=k=>P(store('kv').get(k));

/* ============ أدوات ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const uniq=a=>[...new Set(a.filter(Boolean))];
const norm=s=>String(s||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064B-\u0652]/g,'');
const safeName=s=>String(s).replace(/[\\/:*?"<>|]/g,'-').trim()||'بدون اسم';
const fsOK='showDirectoryPicker' in window;
let urls=[];function ourl(b){const u=URL.createObjectURL(b);urls.push(u);return u;}
function freeUrls(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[];}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4200);}

function parseD(s){if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function today(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function daysUntil(s){const d=parseD(s);return d?Math.round((d-today())/864e5):null;}
function fmtD(s){const d=parseD(s);return d?d.toLocaleDateString('ar-u-nu-latn',{day:'numeric',month:'long',year:'numeric'}):'—';}
function daysTxt(n){if(n===1)return 'يوم واحد';if(n===2)return 'يومين';if(n>=3&&n<=10)return n+' أيام';return n+' يوماً';}
function age(s){const b=parseD(s);if(!b)return null;const t=today();let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;return a;}
function nextBday(s){const b=parseD(s);if(!b)return null;const t=today();let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());return{days:Math.round((n-t)/864e5),turns:n.getFullYear()-b.getFullYear(),date:n};}
function bdayLabel(nb){return nb.days===0?'اليوم':(nb.days===1?'غداً':'بعد '+daysTxt(nb.days));}

const DOC_TYPES=[['passport','جواز السفر',''],['cpr','البطاقة السكانية (الهوية)',''],['license','رخصة السياقة',''],['vehicle','ملكية المركبة',''],['birth','شهادة الميلاد',''],['edu','شهادة دراسية',''],['insurance','وثيقة تأمين',''],['property','عقد / وثيقة ملكية',''],['other','مستند آخر','']];
const dtype=k=>DOC_TYPES.find(t=>t[0]===k)||DOC_TYPES[DOC_TYPES.length-1];

function kindOf(name){const e=(name.split('.').pop()||'').toLowerCase();
 if(['jpg','jpeg','png','gif','webp','bmp','heic','heif','tif','tiff'].includes(e))return 'img';
 if(e==='pdf')return 'pdf';
 if(['mp4','mov','webm','m4v','3gp','avi','mkv'].includes(e))return 'video';
 if(['doc','docx','xls','xlsx','ppt','pptx','txt','rtf','csv','accdb','mdb'].includes(e))return 'doc';
 return 'other';}
const KIND_IC={img:'صورة',pdf:'PDF',video:'فيديو',doc:'مستند',other:'ملف'};
function mimeOf(name){const e=(name.split('.').pop()||'').toLowerCase();return {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',pdf:'application/pdf',mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime'}[e]||'';}

/* ============ الحالة ============ */
let members=[],docs=[],settings={remindDays:60,lastBackup:null},root=null;
let view={name:'home'},curBase=null,curEntries=[],searchToken=0;
async function load(){members=await getAll('members');docs=await getAll('docs');settings=Object.assign({remindDays:60,lastBackup:null},(await kvGet('settings'))||{});root=(await kvGet('root'))||null;
 members.sort((a,b)=>(a.order??a.created??0)-(b.order??b.created??0));}
const byId=id=>members.find(m=>m.id===id);
function docStatus(d){const n=daysUntil(d.expiryDate);if(n===null)return{k:'none',label:'بدون تاريخ انتهاء',n:99999};
 if(n<0)return{k:'expired',label:'منتهي منذ '+daysTxt(-n),n};
 const r=+d.remindDays||+settings.remindDays||60;
 if(n<=r)return{k:'soon',label:n===0?'ينتهي اليوم':'ينتهي بعد '+daysTxt(n),n};
 return{k:'ok',label:'ساري المفعول',n};}
function alertsList(){return vDocs().map(d=>({d,s:docStatus(d)})).filter(o=>o.s.k==='expired'||o.s.k==='soon').sort((a,b)=>a.s.n-b.s.n);}
function upcomingBdays(lim){return vMembers().map(x=>({x,b:nextBday(x.birthDate)})).filter(o=>o.b&&o.b.days<=lim).sort((a,b)=>a.b.days-b.b.days);}
/* ============ رب الأسرة والخصوصية ============ */
let session=null;
async function sha(s){s='aby|'+s;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(_){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))|0;return 'f'+(h>>>0).toString(16);}}
const isAdmin=()=>!settings.adminPin||session==='admin';
const isLocked=()=>!!settings.adminPin&&!session;
const heads=()=>members.filter(m=>m.isHead);
function headOf(x){if(!x)return null;if(x.isHead)return x;const h=x.headId?byId(x.headId):null;return h&&h.isHead?h:null;}
function canSee(x){if(!x)return false;if(isAdmin())return true;const h=headOf(x);return !!h&&h.id===session;}
const vMembers=()=>members.filter(canSee);
const vDocs=()=>docs.filter(d=>canSee(byId(d.memberId)));
function avatar(x,cls=''){return x.photo?`<img class="av ${cls}" src="${ourl(x.photo)}" alt="">`:`<div class="av ${cls}">${esc((x.name||'؟').trim().charAt(0))}</div>`;}

/* ============ العرض ============ */
function go(name,p={}){view={name,...p};render();window.scrollTo(0,0);}
function renderSess(){const el=$('#sess');const locked=isLocked();
 document.querySelectorAll('.nav button').forEach(b=>{const v=b.dataset.v;b.hidden=locked||(!isAdmin()&&(v==='library'||v==='settings'));});
 document.querySelector('.hsearch').hidden=locked;
 if(!settings.adminPin){el.innerHTML='';return;}
 if(locked){el.innerHTML='<span class="chip">مقفل</span>';return;}
 const h=session==='admin'?null:byId(session);
 el.innerHTML=`<span class="chip">${session==='admin'?'المدير':'أسرة '+esc(h?h.name:'')}</span><button class="btn sm ghost" data-act="lock">قفل</button>`;}
function render(){freeUrls();searchToken++;renderSess();
 if(isLocked()){$('#navAlertCount').hidden=true;document.title='أرشيف أبو ياسر';vLock($('#main'));return;}
 if(!isAdmin()&&['library','settings'].includes(view.name))view={name:'home'};
 const al=alertsList();const pc=$('#navAlertCount');pc.textContent=al.length;pc.hidden=!al.length;
 document.title=(al.length?`(${al.length}) `:'')+'أرشيف أبو ياسر';
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===view.name||(['member','search'].includes(view.name)&&b.dataset.v==='home')));
 ({home:vHome,member:vMember,alerts:vAlerts,library:vLibrary,settings:vSettings,search:vSearch}[view.name]||vHome)($('#main'));}

function vLock(m){const hs=heads();
 m.innerHTML=`<div class="card" style="max-width:860px;margin:16px auto"><h2 style="font-size:26px">اختر أسرتك للدخول</h2><p class="muted small">كل أسرة ترى أفرادها ومستنداتها فقط، ويُطلب رمز الأسرة للدخول.</p>
 ${hs.length?`<div class="members" style="margin-top:14px">${hs.map(h=>`<div class="mcard" data-act="unlockFam" data-id="${h.id}">${avatar(h)}<div class="nm">أسرة ${esc(h.name)}</div>${h.pin?'':'<div class="small muted">لم يُحدَّد رمز بعد</div>'}</div>`).join('')}</div>`:'<p class="muted">لم يُحدَّد أي رب أسرة بعد.</p>'}
 <div style="margin-top:12px"><button class="btn gold" data-act="unlockAdmin">دخول المدير</button></div></div>`;}

function signed(n){return n<0?'−'+(-n):String(n);}
function drow(o){const x=byId(o.d.memberId);if(!x)return '';const T=dtype(o.d.type);const n=o.s.n;
 return `<div class="drow ${o.s.k}" data-act="openMember" data-id="${x.id}"><div class="dn">${signed(n)}<small>${Math.abs(n)===1?'يوم':Math.abs(n)===2?'يومان':(Math.abs(n)>=3&&Math.abs(n)<=10)?'أيام':'يوماً'}</small></div><div><b>${esc(o.d.title||T[1])}</b><span>${esc(x.name)} · ${fmtD(o.d.expiryDate)}</span></div><span class="badge b-${o.s.k}">${o.s.k==='expired'?'منتهٍ':'قريب'}</span></div>`;}
function vHome(m){const al=alertsList();const bd=upcomingBdays(30);
 const exp=al.filter(o=>o.s.k==='expired').length,soon=al.length-exp;const VM=vMembers(),VD=vDocs();
 const daysSinceBk=settings.lastBackup?Math.round((Date.now()-settings.lastBackup)/864e5):null;
 let h='';
 if(isAdmin()&&!settings.adminPin&&heads().length)h+=`<div class="notice k"><span>حدّدت أرباب أسر، لكن الخصوصية غير مفعّلة بعد. حدّد «رمز المدير» من الإعدادات ليُطلب رمز كل أسرة عند الدخول.</span><button class="btn sm ghost" data-act="nav" data-v="settings">الإعدادات</button></div>`;
 if(isAdmin()&&members.length&&(daysSinceBk===null||daysSinceBk>30))h+=`<div class="notice k"><span>${daysSinceBk===null?'لم تُحفظ أي نسخة احتياطية بعد.':'مضى '+daysTxt(daysSinceBk)+' على آخر نسخة احتياطية.'} يُنصح بحفظ نسخة بشكل دوري.</span><button class="btn sm" data-act="nav" data-v="settings">حفظ نسخة الآن</button></div>`;
 const nx=al[0]||vDocs().map(d=>({d,s:docStatus(d)})).filter(o=>o.d.expiryDate&&o.s.n>=0).sort((a,b)=>a.s.n-b.s.n)[0];
 const hr=new Date().getHours();const greet=hr<12?'صباح الخير':'مساء الخير';
 const state=exp?`لديك <b>${exp===1?'مستند منتهٍ':exp===2?'مستندان منتهيان':exp+' مستندات منتهية'}</b>`:soon?`<b>${soon===1?'مستند واحد':soon} يقترب</b> من الانتهاء`:'<b>كل شيء ساري المفعول</b>';
 let ring='';if(nx){const x=byId(nx.d.memberId);const T=dtype(nx.d.type);const r=+nx.d.remindDays||+settings.remindDays||60;const left=nx.s.n;const frac=left<0?1:Math.max(.04,Math.min(1,1-left/Math.max(r,1)));const col=left<0?'#ff8f86':nx.s.k==='soon'?'#e2b45c':'#8fd1b1';
  ring=`<div class="nextdoc" data-act="openMember" data-id="${x?x.id:''}" style="cursor:pointer"><svg viewBox="0 0 96 96"><circle class="ring-bg" cx="48" cy="48" r="40" fill="none" stroke-width="7"/><circle class="ring" cx="48" cy="48" r="40" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="${(251.3*(1-frac)).toFixed(1)}" transform="rotate(-90 48 48)"/><text x="48" y="54" text-anchor="middle" font-family="Tajawal" font-weight="700" font-size="22" fill="#fff">${Math.abs(left)}</text></svg><div><b>${esc(nx.d.title||T[1])}${x?' — '+esc(x.name):''}</b><span>${left<0?'انتهى منذ '+daysTxt(-left):left===0?'ينتهي اليوم':'يبقى '+daysTxt(left)} · ${fmtD(nx.d.expiryDate)}</span></div></div>`;}
 h+=`<section class="hero"><div class="hero-l"><p class="greet">${greet}، ${state}</p><div class="meta">${VM.length} فرداً · ${VD.length} مستنداً</div>${ring}</div>
 <div class="hero-r"><h2>يحتاج تجديداً ${al.length>6?`<a class="lnk" data-act="nav" data-v="alerts">عرض الكل (${al.length})</a>`:''}</h2>${al.length?al.slice(0,6).map(drow).join(''):`<div class="empty" style="text-align:start;padding:8px 0">لا يوجد ما يحتاج تجديداً الآن.</div>`}</div></section>`;
 if(bd.length)h+=`<div class="card"><h2>أعياد ميلاد خلال 30 يوماً</h2><div class="list">${bd.map(o=>`<div class="item" data-act="openMember" data-id="${o.x.id}">${avatar(o.x,'sm')}<div class="grow"><b>${esc(o.x.name)}</b><div class="small muted">${o.b.date.toLocaleDateString('ar-u-nu-latn',{day:'numeric',month:'long'})} — يتم ${o.b.turns} سنة</div></div><span class="badge b-soon">${bdayLabel(o.b)}</span></div>`).join('')}</div></div>`;
 h+=`<div class="card"><div class="row between" style="margin-bottom:16px"><h2 style="margin:0">أفراد الأرشيف</h2><div class="row"><input class="inp" id="mq" placeholder="تصفية بالاسم أو الأسرة…" value="${esc(view.q||'')}"><button class="btn" data-act="addMember">إضافة فرد</button></div></div><div id="grid"></div></div>`;
 m.innerHTML=h;renderGrid();
 $('#mq').oninput=e=>{view.q=e.target.value;renderGrid();};}

function renderGrid(){const q=norm(view.q);const g=$('#grid');const VM=vMembers();
 if(!VM.length){g.innerHTML=`<div class="empty"><div class="glyph">0</div><p>ابدأ بإضافة نفسك ثم أبنائك وأسرهم، ولكل فرد ملفه الخاص بصورته ومستنداته.</p><button class="btn" data-act="addMember">إضافة أول فرد</button></div>`;return;}
 const groups={};VM.filter(x=>!q||norm([x.name,x.relation,x.family,(headOf(x)||{}).name].join(' ')).includes(q)).forEach(x=>{const hd=headOf(x);const k=hd?'h:'+hd.id:'f:'+(x.family||'أفراد آخرون');const lbl=hd?'أسرة '+hd.name:(x.family||'أفراد آخرون');(groups[k]=groups[k]||{lbl,h:!!hd,list:[]}).list.push(x);});
 Object.values(groups).forEach(G=>G.list.sort((a,b)=>(b.isHead?1:0)-(a.isHead?1:0)));
 const keys=Object.keys(groups).sort((a,b)=>{const A=groups[a],B=groups[b];if(A.h!==B.h)return A.h?-1:1;if(A.lbl==='أفراد آخرون')return 1;if(B.lbl==='أفراد آخرون')return -1;return A.lbl.localeCompare(B.lbl,'ar');});
 g.innerHTML=keys.length?keys.map(k=>`<div class="gtitle">${esc(groups[k].lbl)} <span class="muted small">(${groups[k].list.length})</span></div><div class="members">${groups[k].list.map(x=>{const n=docs.filter(d=>d.memberId===x.id&&['expired','soon'].includes(docStatus(d).k)).length;const nb=nextBday(x.birthDate);
  return `<div class="mcard" data-act="openMember" data-id="${x.id}">${n?`<span class="dot badge b-expired" title="مستندات تحتاج تجديد">${n}</span>`:''}${avatar(x)}<div class="nm">${esc(x.name)}</div><div class="small muted">${esc(x.relation||'')}</div>${x.isHead?'<div class="hbadge">رب الأسرة</div>':''}${nb&&nb.days<=7?`<div class="badge b-soon" style="margin-top:2px">عيد ميلاد ${bdayLabel(nb)}</div>`:''}</div>`;}).join('')}</div>`).join(''):'<p class="muted">لا توجد نتائج مطابقة.</p>';}

function docCard(d,showMember){const s=docStatus(d);const T=dtype(d.type);const x=byId(d.memberId);
 return `<div class="doc ${s.k}"><div class="dhead"><div><div class="dt">${esc(d.title||T[1])}</div>${showMember&&x?`<a class="lnk" data-act="openMember" data-id="${x.id}">${esc(x.name)}</a> `:''}<div><span class="badge b-${s.k}">${s.label}</span></div></div>${d.expiryDate?`<div class="dbig">${signed(s.n)}<small>يوماً</small></div>`:''}</div>
 <div class="kv">${d.number?`<div><span>الرقم</span><b dir="ltr">${esc(d.number)}</b></div>`:''}${d.issueDate?`<div><span>تاريخ الإصدار</span><b>${fmtD(d.issueDate)}</b></div>`:''}${d.expiryDate?`<div><span>تاريخ الانتهاء</span><b>${fmtD(d.expiryDate)}</b></div>`:''}</div>
 ${d.notes?`<div class="muted small" style="margin-top:8px">${esc(d.notes)}</div>`:''}
 ${(d.files||[]).length?`<div class="thumbs">${d.files.map((f,i)=>(f.type||mimeOf(f.name)).startsWith('image/')?`<img class="thumb" src="${ourl(f.blob)}" data-act="viewDoc" data-id="${d.id}" data-i="${i}" title="${esc(f.name)}">`:`<div class="thumb" data-act="viewDoc" data-id="${d.id}" data-i="${i}" title="${esc(f.name)}">${KIND_IC[kindOf(f.name)]}<br>${esc((f.name.split('.').pop()||'').toUpperCase())}</div>`).join('')}</div>`:'<div class="small muted" style="margin-top:10px">لا توجد صورة مرفقة</div>'}
 <div class="row dacts"><button class="btn sm wa" data-act="shareDoc" data-id="${d.id}">إرسال واتساب</button><button class="btn ghost sm" data-act="editDoc" data-id="${d.id}">تعديل</button><button class="btn ghost sm" data-act="saveDocToFolder" data-id="${d.id}">نسخ إلى مجلده</button><button class="btn danger sm" data-act="delDoc" data-id="${d.id}">حذف</button></div></div>`;}

async function vMember(m){const x=byId(view.id);if(!x||!canSee(x))return go('home');const hd=headOf(x);
 const md=docs.filter(d=>d.memberId===x.id).sort((a,b)=>docStatus(a).n-docStatus(b).n);

 <div class="facts">${x.birthDate?`<span>الميلاد ${fmtD(x.birthDate)}${a!==null?` — العمر ${a} سنة`:''}</span>`:''}${nb&&nb.days<=30?`<span class="badge b-soon">عيد ميلاده ${bdayLabel(nb)}</span>`:''}${x.phone?`<span>الهاتف <span dir="ltr">${esc(x.phone)}</span></span>`:''}</div>
 ${x.notes?`<div class="notes">${esc(x.notes).replace(/\n/g,'<br>')}</div>`:''}</div>
 <div class="pact"><button class="btn sm" data-act="editMember" data-id="${x.id}">تعديل البيانات</button>${isAdmin()?`<button class="btn danger sm" data-act="delMember" data-id="${x.id}">حذف من البرنامج</button>`:''}</div></div>
 <div class="tabs"><button class="${tab==='docs'?'active':''}" data-act="tab" data-t="docs">المستندات الرسمية (${md.length})</button><button class="${tab==='files'?'active':''}" data-act="tab" data-t="files">صوره وملفاته في الجهاز</button></div><div id="tabBody"></div>`;
 const b=$('#tabBody');
 if(tab==='docs'){b.innerHTML=`<div class="row between" style="margin-bottom:12px"><span class="muted small">جواز السفر، البطاقة السكانية، رخصة السياقة، ملكية المركبة وغيرها — مع تنبيه قبل انتهاء الصلاحية.</span><button class="btn" data-act="addDoc" data-id="${x.id}">إضافة مستند</button></div>${md.length?`<div class="docs">${md.map(d=>docCard(d)).join('')}</div>`:'<div class="empty" style="border-top:2px solid var(--ink)">لم تُضف مستندات لهذا الفرد بعد.</div>'}`;}
 else await vMemberFiles(b,x);}

async function vMemberFiles(el,x){
 if(!fsOK){el.innerHTML=unsupportedHtml();return;}
 const h=await kvGet('h:'+x.id);
 if(!h){el.innerHTML=`<div class="card empty"><p>لم يُربط مجلد من جهازك بهذا الفرد بعد.<br>عند الربط تظهر هنا صوره ومستنداته المحفوظة في القرص الصلب مباشرة.</p><div class="row" style="justify-content:center">${root?'<button class="btn" data-act="createFolder">إنشاء مجلد له داخل المجلد الرئيسي</button>':''}<button class="btn ghost" data-act="linkFolder">ربط مجلده الموجود في الجهاز</button></div>${root?'':'<p class="small muted">تلميح: حدِّد «المجلد الرئيسي» للأرشيف من صفحة الإعدادات لتسهيل إنشاء مجلدات الأفراد.</p>'}</div>`;return;}
 el.innerHTML=`<div class="card"><div class="row between fbar"><div><b>${esc(h.name)}</b> <span class="muted small">— المجلد المرتبط بهذا الفرد</span></div><div class="row"><button class="btn ghost sm" data-act="linkFolder">تغيير المجلد</button><button class="btn ghost sm" data-act="unlinkFolder">فك الربط</button></div></div><div id="fp"></div></div>`;
 curBase=h;await folderPane($('#fp'),h,view.path||[]);}

function unsupportedHtml(){return `<div class="card empty">تصفّح ملفات الجهاز يعمل في متصفح <b>Google Chrome</b> أو <b>Microsoft Edge</b>. افتح البرنامج بأحدهما لتفعيل هذه الميزة.</div>`;}

async function listDir(h){const out=[];for await(const e of h.values())out.push(e);
 return out.sort((a,b)=>a.kind!==b.kind?(a.kind==='directory'?-1:1):a.name.localeCompare(b.name,'ar',{numeric:true}));}

function tile(e,i,pth){if(e.kind==='directory')return `<div class="ftile" data-act="fdir" data-name="${esc(e.name)}"><div class="ic dir">مجلد</div><div class="nm">${esc(e.name)}</div></div>`;
 const k=kindOf(e.name);const thumb=k==='img'&&!/\.(heic|heif|tif|tiff)$/i.test(e.name);
 return `<div class="ftile" data-act="fopen" data-i="${i}" title="${esc(e.name)}"><div class="ic" ${thumb?`data-thumb data-i="${i}"`:''}>${KIND_IC[k]}</div><div class="nm">${esc(e.name)}</div>${pth?`<div class="pth">${esc(pth)}</div>`:''}</div>`;}

let io;function observeThumbs(scope){io&&io.disconnect();io=new IntersectionObserver(ents=>{ents.forEach(async en=>{if(!en.isIntersecting)return;const el=en.target;io.unobserve(el);const e=curEntries[+el.dataset.i];try{const f=await e.getFile();const img=new Image();img.onload=()=>{el.innerHTML='';el.appendChild(img);};img.src=ourl(f);}catch(_){}});},{rootMargin:'400px'});scope.querySelectorAll('[data-thumb]').forEach(el=>io.observe(el));}

async function folderPane(el,base,path){
 el.innerHTML='<div class="empty">جارٍ قراءة المجلد…</div>';
 if((await base.queryPermission({mode:'read'}))!=='granted'){el.innerHTML=`<div class="empty"><p>يحتاج البرنامج إلى إذنك لقراءة المجلد «${esc(base.name)}».<br><span class="small">(يطلبه المتصفح عادةً مرة واحدة في كل جلسة)</span></p><button class="btn" data-act="grant">السماح بالوصول</button></div>`;return;}
 let h=base;try{for(const n of path)h=await h.getDirectoryHandle(n);}catch(_){view.path=[];path=[];h=base;}
 let items;try{items=await listDir(h);}catch(e){el.innerHTML=`<div class="empty">تعذّرت قراءة المجلد: ${esc(e.message)}</div>`;return;}
 const flt=view.flt||'all';const shown=items.filter(e=>e.kind==='directory'||flt==='all'||kindOf(e.name)===flt);
 curEntries=shown;const LIMIT=view.limit||300;const nd=shown.filter(e=>e.kind==='directory').length;
 const crumbs=[`<a data-act="crumb" data-i="-1">${esc(base.name)}</a>`,...path.map((n,i)=>`<a data-act="crumb" data-i="${i}">${esc(n)}</a>`)].join(' <span class="muted">/</span> ');
 el.innerHTML=`<div class="row between fbar"><div class="crumbs">${crumbs}</div><div class="row"><select class="inp" style="min-width:150px" data-chg="flt">${[['all','كل الملفات'],['img','الصور فقط'],['pdf','ملفات PDF'],['video','الفيديو'],['doc','المستندات المكتبية']].map(o=>`<option value="${o[0]}" ${o[0]===flt?'selected':''}>${o[1]}</option>`).join('')}</select><span class="muted small">${nd} مجلد · ${shown.length-nd} ملف</span></div></div>
 ${shown.length?`<div class="files">${shown.slice(0,LIMIT).map((e,i)=>tile(e,i)).join('')}</div>`:'<div class="empty">لا توجد ملفات هنا.</div>'}
 ${shown.length>LIMIT?`<div class="empty"><button class="btn ghost" data-act="more">عرض المزيد (${shown.length-LIMIT})</button></div>`:''}`;
 observeThumbs(el);}

async function diskSearchRun(el,q){
 if((await root.queryPermission({mode:'read'}))!=='granted'){el.innerHTML=`<div class="empty"><button class="btn" data-act="grant">السماح بالوصول إلى المجلد</button></div>`;return;}
 const tok=++searchToken;const out=[];const st={n:0,stop:false};const nq=norm(q);
 el.innerHTML='<div class="empty" id="sst">جارٍ البحث…</div>';
 async function walk(h,path){for await(const e of h.values()){if(st.stop||tok!==searchToken)return;st.n++;
  if(st.n%400===0){const s=$('#sst');if(s)s.textContent=`جارٍ البحث… فُحص ${st.n} عنصر، وُجد ${out.length}`;}
  if(norm(e.name).includes(nq))out.push({e,p:path.join(' / ')});
  if(out.length>=400){st.stop=true;return;}
  if(e.kind==='directory')await walk(e,[...path,e.name]);}}
 try{await walk(root,[root.name]);}catch(err){}
 if(tok!==searchToken)return;
 const files=out.filter(o=>o.e.kind==='file'),dirs=out.filter(o=>o.e.kind==='directory');
 curEntries=files.map(o=>o.e);
 el.innerHTML=`<p class="muted small">النتائج لـ «${esc(q)}»: ${files.length} ملف و${dirs.length} مجلد${st.stop?' (عُرضت أول 400 نتيجة — حدّد كلمة البحث أكثر)':''}</p>
 ${dirs.length?`<h3>المجلدات</h3><div class="list" style="margin-bottom:14px">${dirs.map(o=>`<div class="item" data-act="gotoDir" data-p="${esc(o.p.split(' / ').slice(1).concat(o.e.name).join('\u0001'))}"><span class="badge b-none">مجلد</span><div class="grow"><b>${esc(o.e.name)}</b><div class="small muted">${esc(o.p)}</div></div></div>`).join('')}</div>`:''}
 ${files.length?`<h3>الملفات</h3><div class="files">${files.map((o,i)=>tile(o.e,i,o.p)).join('')}</div>`:''}
 ${!out.length?'<div class="empty">لا توجد نتائج.</div>':''}`;
 observeThumbs(el);}

function modal(title,body,onSave,saveLabel='حفظ'){const bg=document.createElement('div');bg.className='modal-bg';
 bg.innerHTML=`<form class="modal"><h2>${title}</h2>${body}<div class="row mfoot"><button class="btn" type="submit">${saveLabel}</button><button class="btn ghost" type="button" data-close>إلغاء</button></div></form>`;
 document.body.appendChild(bg);const f=bg.querySelector('form');const close=()=>bg.remove();
 bg.addEventListener('mousedown',e=>{if(e.target===bg)close();});bg.querySelector('[data-close]').onclick=close;
 f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('[type=submit]');b.disabled=true;try{if((await onSave(f))!==false)close();}catch(err){console.error(err);toast('خطأ: '+err.message,true);}b.disabled=false;};
 setTimeout(()=>{const i=f.querySelector('input:not([type=file]):not([type=checkbox]),select,textarea');i&&i.focus();},50);return f;}

async function resizeImg(file,max=640){try{const bmp=await createImageBitmap(file);const s=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.9));}catch(_){return file;}}

/* ============ العارض ============ */
let lb={items:[],i:0,url:null,el:null};
function openViewer(items,i){lb.items=items;lb.i=i;if(!lb.el){lb.el=document.createElement('div');lb.el.className='lb';document.body.appendChild(lb.el);lb.el.addEventListener('mousedown',e=>{if(e.target===lb.el||e.target.classList.contains('stage'))closeViewer();});}showLb();}
function closeViewer(){if(lb.url)URL.revokeObjectURL(lb.url);lb.url=null;lb.el&&lb.el.remove();lb.el=null;}
async function showLb(){const it=lb.items[lb.i];let blob;try{blob=await it.get();}catch(e){toast('تعذّر فتح الملف: '+e.message,true);return;}
 if(lb.url)URL.revokeObjectURL(lb.url);const type=blob.type||mimeOf(it.name);lb.url=URL.createObjectURL(type&&!blob.type?new Blob([blob],{type}):blob);
 let inner;if(type.startsWith('image/'))inner=`<img src="${lb.url}" alt="" onerror="this.outerHTML='<div style=&quot;color:#fff&quot;>لا يمكن عرض هذه الصورة هنا (قد تكون بصيغة HEIC). استخدم زر التنزيل لفتحها.</div>'">`;
 else if(type.startsWith('video/'))inner=`<video src="${lb.url}" controls autoplay></video>`;
 else if(type==='application/pdf')inner=`<iframe src="${lb.url}"></iframe>`;
 else inner=`<div style="color:#fff;text-align:center"><div style="font-size:40px;font-weight:900">${KIND_IC[kindOf(it.name)]}</div><p>لا يمكن عرض هذا النوع من الملفات داخل البرنامج.<br>افتحه من مجلده في الجهاز، أو نزّل نسخة منه.</p></div>`;
 const n=lb.items.length;
 lb.el.innerHTML=`<div class="stage">${inner}</div><div class="tb"><a class="btn sm gold" href="${lb.url}" download="${esc(it.name)}">تنزيل نسخة</a>${type==='application/pdf'?`<a class="btn sm ghost" href="${lb.url}" target="_blank">فتح في نافذة</a>`:''}<button class="btn sm ghost" data-lb="x">إغلاق</button></div>
 ${n>1?'<button class="nb prev" data-lb="p">›</button><button class="nb next" data-lb="n">‹</button>':''}<div class="cap">${esc(it.name)}${n>1?` — ${lb.i+1} من ${n}`:''}</div>`;
 lb.el.querySelectorAll('[data-lb]').forEach(b=>b.onclick=()=>{const a=b.dataset.lb;if(a==='x')closeViewer();else{lb.i=(lb.i+(a==='n'?1:-1)+n)%n;showLb();}});}
document.addEventListener('keydown',e=>{if(!lb.el)return;const n=lb.items.length;if(e.key==='Escape')closeViewer();else if(n>1&&e.key==='ArrowLeft'){lb.i=(lb.i+1)%n;showLb();}else if(n>1&&e.key==='ArrowRight'){lb.i=(lb.i-1+n)%n;showLb();}});

/* ============ النسخ الاحتياطي ============ */
const b2d=b=>new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>j(fr.error);fr.readAsDataURL(b);});
function d2b(u){const i=u.indexOf(',');const mime=(u.slice(0,i).match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const bin=atob(u.slice(i+1));const a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:mime});}
async function buildBackup(){const ms=[];for(const x of members)ms.push({...x,photo:x.photo?await b2d(x.photo):null});
 const ds=[];for(const d of docs){const fs=[];for(const f of d.files||[])fs.push({name:f.name,type:f.type,data:await b2d(f.blob)});ds.push({...d,files:fs});}
 return new Blob([JSON.stringify({app:'abu-yaser-archive',version:1,date:new Date().toISOString(),settings:{remindDays:settings.remindDays},members:ms,docs:ds})],{type:'application/json'});}
const bkName=()=>`نسخة احتياطية - أرشيف أبو ياسر - ${new Date().toISOString().slice(0,10)}.json`;
async function markBackup(){settings.lastBackup=Date.now();await put('kv',settings,'settings');}
async function uniqueFile(dir,name){const dot=name.lastIndexOf('.');const base=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'';let n=name,i=2;
 while(true){try{await dir.getFileHandle(n);n=`${base} (${i++})${ext}`;}catch(_){return dir.getFileHandle(n,{create:true});}}}
async function writeBlob(dir,name,blob){const fh=await uniqueFile(dir,safeName(name));const w=await fh.createWritable();await w.write(blob);await w.close();return fh.name;}
async function needWrite(h){return (await h.queryPermission({mode:'readwrite'}))==='granted'||(await h.requestPermission({mode:'readwrite'}))==='granted';}

/* ============ الأوامر ============ */
const ACT={
 nav:d=>go(d.v),
 gsearch:()=>{const q=$('#gq').value.trim();if(q)go('search',{q});},
 searchDiskFor:()=>go('library',{dq:view.q}),
 openMember:d=>d.id&&go('member',{id:d.id}),
 tab:d=>{view.tab=d.t;view.path=[];view.flt='all';view.limit=300;render();},
 addMember:()=>openMemberForm({}),
 editMember:d=>openMemberForm(byId(d.id)),
 delMember:async d=>{const x=byId(d.id);const n=docs.filter(o=>o.memberId===x.id).length;
  if(!confirm(`هل تريد حذف «${x.name}» من البرنامج؟\nسيُحذف معه ${n} مستند محفوظ داخل البرنامج.${x.isHead?'\nوهو رب أسرة: سيُفكّ ارتباط أفراد أسرته به (ولن يُحذفوا).':''}\n\nملاحظة: لن يُحذف أي ملف أو مجلد من جهازك.`))return;
  for(const o of docs.filter(o=>o.memberId===x.id))await del('docs',o.id);for(const o of members.filter(o=>o.headId===x.id))await put('members',{...o,headId:null});await del('members',x.id);await del('kv','h:'+x.id);await load();toast('تم الحذف من البرنامج');go('home');},
 addDoc:d=>openDocForm({memberId:d.id}),
 editDoc:d=>openDocForm(docs.find(o=>o.id===d.id)),
 delDoc:async d=>{const o=docs.find(x=>x.id===d.id);if(!confirm(`حذف مستند «${o.title||dtype(o.type)[1]}» من البرنامج؟`))return;await del('docs',o.id);await load();render();toast('تم الحذف');},
 viewDoc:d=>{const o=docs.find(x=>x.id===d.id);openViewer(o.files.map(f=>({name:f.name,get:async()=>f.blob})),+d.i);},
 saveDocToFolder:async d=>{const o=docs.find(x=>x.id===d.id);const x=byId(o.memberId);const h=await kvGet('h:'+x.id);
  if(!fsOK)return toast('هذه الميزة تتطلب Chrome أو Edge',true);
  if(!h)return toast('اربط مجلداً لهذا الفرد أولاً من تبويب «صوره وملفاته في الجهاز»',true);
  if(!(o.files||[]).length)return toast('لا توجد صور مرفقة بهذا المستند',true);
  const sub='المستندات الرسمية';
  if(!confirm(`سيتم نسخ ${o.files.length} ملف إلى:\n${h.name} / ${sub}\n\nلن يُستبدل أي ملف موجود؛ إذا تكرر الاسم يُضاف رقم إليه. هل تريد المتابعة؟`))return;
  if(!(await needWrite(h)))return toast('لم يُمنح إذن الكتابة',true);
  const dir=await h.getDirectoryHandle(sub,{create:true});const T=o.title||dtype(o.type)[1];
  for(const f of o.files){const ext=f.name.includes('.')?f.name.slice(f.name.lastIndexOf('.')):'';await writeBlob(dir,`${T}${o.number?' - '+o.number:''}${o.files.length>1?' - '+f.name.replace(/\.[^.]+$/,''):''}${ext}`,f.blob);}
  toast(`تم نسخ الملفات إلى «${h.name} / ${sub}»`);},
 linkFolder:async()=>{const x=byId(view.id);try{const opts={mode:'read',id:'member'};if(root)opts.startIn=root;const h=await showDirectoryPicker(opts);await put('kv',h,'h:'+x.id);view.path=[];render();toast('تم ربط المجلد');}catch(e){if(e.name!=='AbortError')toast(e.message,true);}},
 unlinkFolder:async()=>{if(!confirm('فك ربط المجلد بهذا الفرد؟ (لن يُحذف المجلد من جهازك)'))return;await del('kv','h:'+view.id);view.path=[];render();},
 createFolder:async()=>{const x=byId(view.id);const name=safeName(x.name);const subs=['الصور','المستندات الرسمية','المناسبات وأعياد الميلاد'];
  if(!confirm(`سيتم إنشاء المجلد التالي داخل «${root.name}»:\n\n${name}\n   ├ ${subs.join('\n   ├ ')}\n\nإذا كان المجلد موجوداً مسبقاً فسيُربط فقط دون أي تغيير في محتواه. هل تريد المتابعة؟`))return;
  if(!(await needWrite(root)))return toast('لم يُمنح إذن الكتابة',true);
  const h=await root.getDirectoryHandle(name,{create:true});for(const s of subs)await h.getDirectoryHandle(s,{create:true});
  await put('kv',h,'h:'+x.id);view.path=[];render();toast('تم إنشاء المجلد وربطه');},
 grant:async()=>{if(curBase&&(await curBase.requestPermission({mode:'read'}))==='granted')render();},
 fdir:d=>{view.path=[...(view.path||[]),d.name];view.limit=300;if(view.name==='library')view.dq='';render();},
 gotoDir:d=>{view.path=d.p.split('\u0001');view.dq='';view.limit=300;render();},
 crumb:d=>{const i=+d.i;view.path=i<0?[]:(view.path||[]).slice(0,i+1);view.limit=300;render();},
 more:()=>{view.limit=(view.limit||300)+300;render();},
 fopen:d=>{const idx=+d.i;const files=curEntries.map((e,i)=>({e,i})).filter(o=>o.e.kind==='file');openViewer(files.map(o=>({name:o.e.name,get:()=>o.e.getFile()})),Math.max(0,files.findIndex(o=>o.i===idx)));},
 setRoot:async()=>{try{const h=await showDirectoryPicker({mode:'read',id:'root'});await put('kv',h,'root');root=h;view.path=[];render();toast('تم تحديد المجلد الرئيسي');}catch(e){if(e.name!=='AbortError')toast(e.message,true);}},
 diskSearch:()=>{const q=($('#dq')||{}).value?.trim();if(!q)return;view.dq=q;view.path=[];render();},
 clearDisk:()=>{view.dq='';render();},
 saveSettings:async()=>{settings.remindDays=Math.max(1,+$('#setRemind').value||60);await put('kv',settings,'settings');render();toast('تم الحفظ');},
 exportDl:async()=>{toast('جارٍ تجهيز النسخة…');const b=await buildBackup();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=bkName();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);await markBackup();render();toast('تم تنزيل النسخة الاحتياطية');},
 exportRoot:async()=>{if(!(await needWrite(root)))return toast('لم يُمنح إذن الكتابة',true);toast('جارٍ تجهيز النسخة…');const b=await buildBackup();const dir=await root.getDirectoryHandle('النسخ الاحتياطية للأرشيف',{create:true});const n=await writeBlob(dir,bkName(),b);await markBackup();render();toast(`حُفظت النسخة: ${root.name} / النسخ الاحتياطية للأرشيف / ${n}`);},
 importBk:()=>$('#importInp').click(),
 shareDoc:async d=>{const o=docs.find(x=>x.id===d.id);const x=o&&byId(o.memberId);if(!o||!canSee(x))return;const T=o.title||dtype(o.type)[1];
  const list=o.files||[];if(!list.length)return toast('لا توجد صورة مرفقة بهذا المستند لإرسالها',true);
  const files=list.map((f,i)=>{const ext=f.name.includes('.')?f.name.slice(f.name.lastIndexOf('.')):'';return new File([f.blob],safeName(`${T} - ${x.name}${list.length>1?' - '+(i+1):''}`)+ext,{type:f.type||f.blob.type||mimeOf(f.name)});});
  const text=`${T} — ${x.name}${o.expiryDate?'\nتاريخ الانتهاء: '+fmtD(o.expiryDate):''}`;
  if(navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files,text,title:T});}catch(e){if(e.name!=='AbortError')toast('تعذّر الإرسال: '+e.message,true);}return;}
  for(const f of files){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),8000);}
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
  toast('نُزّلت نسخة من المستند في «التنزيلات». أرفقها في محادثة واتساب بزر الإرفاق');},
 lock:()=>{session=null;closeViewer();go('home');},
 unlockAdmin:()=>pinPrompt('دخول المدير',async p=>{if((await sha(p))!==settings.adminPin)return false;session='admin';go('home');return true;}),
 unlockFam:d=>{const h=byId(d.id);if(!h)return;if(!h.pin)return toast('لم يحدِّد المدير رمزاً لهذه الأسرة بعد',true);
  pinPrompt('دخول أسرة '+esc(h.name),async p=>{if((await sha(p))!==h.pin)return false;session=h.id;go('home');return true;});},
 setAdminPin:()=>newPinModal(settings.adminPin?'تغيير رمز المدير':'تحديد رمز المدير','سيُطلب هذا الرمز لفتح الأرشيف كاملاً. احفظه في مكان آمن.',async p=>{settings.adminPin=await sha(p);await put('kv',settings,'settings');session='admin';render();toast('تم حفظ رمز المدير');}),
 rmAdminPin:async()=>{if(!confirm('إلغاء رمز المدير؟ سيصبح البرنامج مفتوحاً بالكامل لكل من يستخدم هذا الجهاز.'))return;settings.adminPin=null;await put('kv',settings,'settings');session=null;render();toast('أُلغي رمز المدير');},
 setFamPin:d=>{const h=byId(d.id);newPinModal('رمز أسرة '+esc(h.name),'تدخل به هذه الأسرة فترى أفرادها ومستنداتها فقط.',async p=>{await put('members',{...h,pin:await sha(p)});await load();render();toast('تم حفظ رمز الأسرة');});}
};
function pinPrompt(title,check){modal(title,`<label class="f">الرمز<input type="password" name="pin" autocomplete="off" required></label><p class="small red" data-err hidden>الرمز غير صحيح</p>`,async f=>{const ok=await check(new FormData(f).get('pin'));if(!ok){f.querySelector('[data-err]').hidden=false;return false;}},'دخول');}
function newPinModal(title,note,onPin){modal(title,`<p class="muted small">${note}</p><div class="form"><label class="f">الرمز الجديد (4 خانات أو أكثر)<input type="password" name="p1" autocomplete="new-password" minlength="4" required></label><label class="f">تأكيد الرمز<input type="password" name="p2" autocomplete="new-password" required></label></div><p class="small red" data-err hidden>الرمزان غير متطابقين</p>`,async f=>{const fd=new FormData(f);if(fd.get('p1')!==fd.get('p2')){f.querySelector('[data-err]').hidden=false;return false;}await onPin(fd.get('p1'));});}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t||t.closest('.modal'))return;e.preventDefault();const fn=ACT[t.dataset.act];if(!fn)return;try{await fn(t.dataset,t,e);}catch(err){console.error(err);toast('حدث خطأ: '+err.message,true);}});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&t.dataset.chg==='flt'){view.flt=t.value;view.limit=300;render();}});
$('#gq').addEventListener('keydown',e=>{if(e.key==='Enter')ACT.gsearch();});
$('#importInp').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const j=JSON.parse(await f.text());if(j.app!=='abu-yaser-archive')throw new Error('الملف ليس نسخة احتياطية من هذا البرنامج');
  if(!confirm(`النسخة بتاريخ ${new Date(j.date).toLocaleString('ar-u-nu-latn')}\nتحتوي ${j.members.length} فرد و${j.docs.length} مستند.\n\nسيتم دمجها مع البيانات الحالية (السجلات المتطابقة تُستبدل بنسخة الملف). هل تريد المتابعة؟`))return;
  for(const x of j.members)await put('members',{...x,photo:x.photo?d2b(x.photo):null});
  for(const d of j.docs)await put('docs',{...d,files:(d.files||[]).map(f=>({name:f.name,type:f.type,blob:d2b(f.data)}))});
  await load();render();toast('تمت الاستعادة');}catch(err){toast('تعذّرت الاستعادة: '+err.message,true);}});

/* ============ التشغيل ============ */
(async()=>{try{db=await openDB();await load();render();const al=alertsList();if(al.length)toast(`تنبيه: ${al.length} مستند منتهٍ أو قارب على الانتهاء`);try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(_){}}
 catch(e){$('#main').innerHTML=`<div class="card empty">تعذّر تشغيل البرنامج: ${esc(e.message)}<br>جرّب فتحه في Google Chrome أو Microsoft Edge.</div>`;}})();
</script>
